<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3A4149"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
  </defs>

  <rect width="1200" height="1200" fill="#F7F5F0"/>

  <!-- Title -->
  <text x="60" y="92" font-size="46" font-weight="700" fill="#1B1F24">Ask a Satellite</text>
  <text x="60" y="134" font-size="22" fill="#4B5563">An agent that answers questions about places on Earth using free Sentinel-2 imagery</text>

  <!-- Question -->
  <rect x="60" y="180" width="500" height="128" rx="18" fill="#FFFFFF" stroke="#D6D3CC" stroke-width="2"/>
  <text x="84" y="214" font-size="15" font-weight="700" fill="#6B7280" letter-spacing="1.5">QUESTION</text>
  <text x="84" y="250" font-size="21" fill="#1B1F24" font-style="italic">"How many large ships are in Port</text>
  <text x="84" y="280" font-size="21" fill="#1B1F24" font-style="italic">Everglades this week vs. last month?"</text>

  <line x1="310" y1="308" x2="310" y2="376" stroke="#3A4149" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Agent -->
  <rect x="60" y="380" width="500" height="330" rx="18" fill="#E6F2F0" stroke="#0F766E" stroke-width="3"/>
  <text x="84" y="420" font-size="15" font-weight="700" fill="#0F766E" letter-spacing="1.5">AGENT LOOP (CLAUDE)</text>
  <text x="84" y="452" font-size="17" fill="#1F4E4A">Reasons about which tool to call next</text>

  <g font-size="19" fill="#1B1F24">
    <rect x="84" y="476" width="452" height="62" rx="12" fill="#FFFFFF" stroke="#9CCBC4"/>
    <circle cx="114" cy="507" r="15" fill="#0F766E"/><text x="108" y="514" fill="#FFFFFF" font-weight="700" font-size="18">1</text>
    <text x="142" y="502">Parse the question</text>
    <text x="142" y="526" font-size="15" fill="#4B5563">place · time range · task</text>

    <rect x="84" y="550" width="452" height="62" rx="12" fill="#FFFFFF" stroke="#9CCBC4"/>
    <circle cx="114" cy="581" r="15" fill="#0F766E"/><text x="108" y="588" fill="#FFFFFF" font-weight="700" font-size="18">2</text>
    <text x="142" y="576">Pick a tool, read the result</text>
    <text x="142" y="600" font-size="15" fill="#4B5563">repeat until it can answer</text>

    <rect x="84" y="624" width="452" height="62" rx="12" fill="#FFFFFF" stroke="#9CCBC4"/>
    <circle cx="114" cy="655" r="15" fill="#0F766E"/><text x="108" y="662" fill="#FFFFFF" font-weight="700" font-size="18">3</text>
    <text x="142" y="650">Write the report</text>
    <text x="142" y="674" font-size="15" fill="#4B5563">numbers copied from tool outputs only</text>
  </g>

  <!-- Agent <-> MCP -->
  <line x1="566" y1="500" x2="632" y2="500" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowA)"/>
  <line x1="634" y1="600" x2="568" y2="600" stroke="#0F766E" stroke-width="3" marker-end="url(#arrowA)"/>
  <text x="600" y="482" font-size="14" fill="#0F766E" text-anchor="middle">tool call</text>
  <text x="600" y="580" font-size="14" fill="#0F766E" text-anchor="middle">result</text>

  <!-- MCP server -->
  <rect x="640" y="380" width="500" height="330" rx="18" fill="#FFFFFF" stroke="#3A4149" stroke-width="3"/>
  <text x="664" y="420" font-size="15" font-weight="700" fill="#3A4149" letter-spacing="1.5">MCP SERVER · TOOLS</text>
  <text x="664" y="452" font-size="17" fill="#4B5563">Deterministic Python; any MCP client can use them</text>

  <g font-size="17" fill="#1B1F24" font-family="Consolas, Menlo, monospace">
    <rect x="664" y="476" width="218" height="58" rx="10" fill="#F1F0EC" stroke="#D6D3CC"/>
    <text x="680" y="502">search_imagery</text>
    <text x="680" y="523" font-size="13" fill="#6B7280" font-family="Segoe UI, Helvetica, Arial, sans-serif">STAC · cloud filter</text>
    <rect x="898" y="476" width="218" height="58" rx="10" fill="#F1F0EC" stroke="#D6D3CC"/>
    <text x="914" y="502">fetch_aoi</text>
    <text x="914" y="523" font-size="13" fill="#6B7280" font-family="Segoe UI, Helvetica, Arial, sans-serif">crop · cloud &amp; water masks</text>

    <rect x="664" y="550" width="218" height="58" rx="10" fill="#F1F0EC" stroke="#D6D3CC"/>
    <text x="680" y="576">detect_vessels</text>
    <text x="680" y="597" font-size="13" fill="#6B7280" font-family="Segoe UI, Helvetica, Arial, sans-serif">classical CV / YOLO</text>
    <rect x="898" y="550" width="218" height="58" rx="10" fill="#F1F0EC" stroke="#D6D3CC"/>
    <text x="914" y="576">compare_counts</text>
    <text x="914" y="597" font-size="13" fill="#6B7280" font-family="Segoe UI, Helvetica, Arial, sans-serif">two dates + caveats</text>

    <rect x="664" y="624" width="218" height="58" rx="10" fill="#F1F0EC" stroke="#D6D3CC"/>
    <text x="680" y="650">render_annotated</text>
    <text x="680" y="671" font-size="13" fill="#6B7280" font-family="Segoe UI, Helvetica, Arial, sans-serif">boxes + credit line</text>
    <rect x="898" y="624" width="218" height="58" rx="10" fill="none" stroke="#B8B4AA" stroke-dasharray="6 5"/>
    <text x="914" y="650" fill="#8A8578">next task…</text>
    <text x="914" y="671" font-size="13" fill="#8A8578" font-family="Segoe UI, Helvetica, Arial, sans-serif">crop health · change</text>
  </g>

  <!-- MCP -> data -->
  <line x1="890" y1="710" x2="890" y2="796" stroke="#3A4149" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="904" y="760" font-size="14" fill="#4B5563">HTTP range reads (AOI only)</text>

  <!-- Data -->
  <rect x="640" y="800" width="500" height="150" rx="18" fill="#E8EEF9" stroke="#2F5EB5" stroke-width="2"/>
  <text x="664" y="838" font-size="15" font-weight="700" fill="#2F5EB5" letter-spacing="1.5">PUBLIC DATA</text>
  <text x="664" y="872" font-size="21" fill="#1B1F24">Sentinel-2 L2A on AWS Open Data</text>
  <text x="664" y="902" font-size="16" fill="#4B5563">Earth Search STAC · Cloud-Optimized GeoTIFFs</text>
  <text x="664" y="928" font-size="16" fill="#4B5563">10 m pixels · every few days · no account needed</text>

  <!-- Agent -> report -->
  <line x1="310" y1="710" x2="310" y2="796" stroke="#3A4149" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Report -->
  <rect x="60" y="800" width="500" height="150" rx="18" fill="#FFFFFF" stroke="#D6D3CC" stroke-width="2"/>
  <text x="84" y="838" font-size="15" font-weight="700" fill="#6B7280" letter-spacing="1.5">REPORT</text>
  <text x="84" y="872" font-size="21" fill="#1B1F24">Answer + counts + image dates</text>
  <text x="84" y="902" font-size="16" fill="#4B5563">Annotated images</text>
  <text x="84" y="928" font-size="16" fill="#4B5563">Limitations: 10 m resolution, cloud, confidence</text>

  <!-- Principle -->
  <line x1="60" y1="1000" x2="1140" y2="1000" stroke="#D6D3CC" stroke-width="2"/>
  <text x="600" y="1056" font-size="32" font-weight="700" fill="#1B1F24" text-anchor="middle">The model decides. The code measures.</text>
  <text x="600" y="1094" font-size="19" fill="#4B5563" text-anchor="middle">Every number in a report comes from a tool that ran on real pixels.</text>

  <text x="60" y="1160" font-size="15" fill="#8A8578">Ask a Satellite · built in public by Bernard Lawes</text>
  <text x="1140" y="1160" font-size="15" fill="#8A8578" text-anchor="end">Python · MCP · Claude · rasterio · STAC</text>
</svg>
